<!doctype html>
<html lang="en">
<head>

<title>Car sharing invite — Romy's Garage</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #ffffff; --fg: #1a1a1a; --muted: #5b5b5b; --border: #e2e2e2; --accent: #0e8f6e; --accent-fg: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #14161a; --fg: #eaeaea; --muted: #a3a3a3; --border: #2c2f36; --accent: #3ecf9e; --accent-fg: #0b1a14; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 17px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  nav.top {
    max-width: 560px; margin: 0 auto; padding: 20px 16px; font-size: 14px;
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
  }
  nav.top a { color: var(--muted); text-decoration: none; }
  #lang-select {
    padding: 6px 10px; font-size: 13px; border-radius: 6px; color: var(--muted);
    background: color-mix(in srgb, var(--fg) 4%, transparent); border: 1px solid var(--border);
  }
  .wrap { max-width: 560px; margin: 0 auto; padding: 24px 16px 80px; text-align: center; }
  .icon {
    width: 84px; height: 84px; border-radius: 50%; margin: 0 auto 20px; display: grid; place-items: center;
    background: color-mix(in srgb, var(--accent) 16%, transparent); color: var(--accent); font-size: 40px;
  }
  h1 { font-size: 1.7rem; line-height: 1.25; margin: 0 0 12px; }
  .lead { color: var(--muted); margin: 0 0 28px; }
  .code-box { border: 1px solid var(--border); border-radius: 20px; padding: 20px 16px; margin-bottom: 20px; }
  .code-label { font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  .code {
    font: 700 2.2rem/1.2 ui-monospace, "SF Mono", Menlo, monospace; letter-spacing: .06em;
    margin: 8px 0 12px; overflow-wrap: anywhere; user-select: all;
  }
  .btn {
    display: block; width: 100%; padding: 15px 18px; border-radius: 999px; font: inherit; font-weight: 600;
    text-decoration: none; border: none; cursor: pointer; margin-top: 12px;
  }
  .btn.primary { background: var(--accent); color: var(--accent-fg); }
  .btn.secondary { background: transparent; color: var(--accent); border: 1.5px solid var(--accent); }
  .btn.small { display: inline-block; width: auto; padding: 8px 16px; font-size: 15px; margin: 0; }
  .steps { color: var(--muted); font-size: .95rem; margin-top: 28px; }
  .hidden { display: none; }
</style>
</head>
<body>
<nav class="top">
  <a href="./">Romy's Garage</a>
  <select id="lang-select" aria-label="Language"></select>
</nav>

  <a class="btn secondary" id="install" href="https://apps.apple.com/app/id6788253177"></a>
  <p class="steps" id="steps"></p>
</main>

  ro: ["Ești invitat să împarți o mașină", "Cineva vrea să-și împartă mașina cu tine în Romy's Garage: călătorii, costuri și calendar într-un singur loc.", "Codul tău de invitație", "Deschide în Romy's Garage", "Descarcă Romy's Garage din App Store", "Nu ai încă aplicația? Instaleaz-o, deschide „Mașină partajată” pe ecranul principal și introdu codul.", "Copiază codul", "Copiat", "Acest link nu conține un cod. Cere o invitație nouă."],

  id: ["Kamu diundang berbagi mobil", "Seseorang ingin berbagi mobilnya denganmu di Romy's Garage: perjalanan, biaya, dan kalender dalam satu tempat.", "Kode undanganmu", "Buka di Romy's Garage", "Dapatkan Romy's Garage di App Store", "Belum punya aplikasinya? Instal, buka “Berbagi mobil” di layar utama, lalu masukkan kodenya.", "Salin kode", "Disalin", "Tautan ini tidak berisi kode. Minta undangan baru."],
  th: ["คุณได้รับเชิญให้แชร์รถ", "มีคนอยากแชร์รถกับคุณใน Romy's Garage: การเดินทาง ค่าใช้จ่าย และปฏิทินในที่เดียว", "รหัสเชิญของคุณ", "เปิดใน Romy's Garage", "ดาวน์โหลด Romy's Garage จาก App Store", "ยังไม่มีแอป? ติดตั้งแอป เปิด “แชร์รถ” ที่หน้าแรก แล้วใส่รหัส", "คัดลอกรหัส", "คัดลอกแล้ว", "ลิงก์นี้ไม่มีรหัส ขอคำเชิญใหม่"],
  vi: ["Bạn được mời dùng chung xe", "Có người muốn dùng chung xe với bạn trong Romy's Garage: chuyến đi, chi phí và lịch ở cùng một nơi.", "Mã mời của bạn", "Mở trong Romy's Garage", "Tải Romy's Garage trên App Store", "Chưa có ứng dụng? Cài đặt, mở “Dùng chung xe” trên màn hình chính và nhập mã.", "Sao chép mã", "Đã sao chép", "Liên kết này không có mã. Hãy xin lời mời mới."],
  ja: ["カーシェアに招待されました", "Romy's Garageで車をシェアしたい人がいます。走行、費用、カレンダーをひとつの場所で。", "あなたの招待コード", "Romy's Garageで開く", "App StoreでRomy's Garageを入手", "まだアプリがない場合は、インストールしてホーム画面の「カーシェア」を開き、コードを入力してください。", "コードをコピー", "コピーしました", "このリンクにはコードがありません。新しい招待をもらってください。"],
  ko: ["카셰어링에 초대되었습니다", "누군가 Romy's Garage에서 차량을 함께 쓰고 싶어 합니다. 주행, 비용, 캘린더를 한곳에서.", "초대 코드", "Romy's Garage에서 열기", "App Store에서 Romy's Garage 받기", "아직 앱이 없나요? 설치한 뒤 홈 화면에서 ‘카셰어링’을 열고 코드를 입력하세요.", "코드 복사", "복사됨", "이 링크에는 코드가 없습니다. 새 초대를 요청하세요."],

  "zh-Hant": ["有人邀請你共享汽車", "有人想在 Romy's Garage 中與你共享汽車：行程、費用和行事曆集中在一處。", "你的邀請碼", "在 Romy's Garage 中開啟", "從 App Store 取得 Romy's Garage", "還沒有安裝 App？安裝後在主畫面開啟「共享汽車」並輸入邀請碼。", "複製邀請碼", "已複製", "此連結中沒有邀請碼。請索取新的邀請。"]

var NAMES = { en: "English", de: "Deutsch", es: "Español", fr: "Français", it: "Italiano", "pt-BR": "Português (Brasil)", nl: "Nederlands", sv: "Svenska", da: "Dansk", nb: "Norsk bokmål", fi: "Suomi", pl: "Polski", cs: "Čeština", ro: "Română", ru: "Русский", uk: "Українська", el: "Ελληνικά", tr: "Türkçe", ar: "العربية", hi: "हिन्दी", id: "Bahasa Indonesia", th: "ไทย", vi: "Tiếng Việt", ja: "日本語", ko: "한국어", "zh-Hans": "简体中文", "zh-Hant": "繁體中文" };

(function () {
  var params = new URLSearchParams(location.search);
  var raw = (params.get("code") || params.get("c") || "").toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 8);
  var code = /^[A-HJ-NP-Z2-9]{8}$/.test(raw) ? raw : "";

  function pick() {
    var wanted = [params.get("lang")].concat(navigator.languages || [navigator.language]).filter(Boolean);
    for (var i = 0; i < wanted.length; i++) {
      var w = wanted[i];
      if (JOIN_I18N[w]) return w;
      var lower = w.toLowerCase();
      if (lower.indexOf("zh") === 0) return /hant|tw|hk|mo/.test(lower) ? "zh-Hant" : "zh-Hans";
      if (lower.indexOf("pt") === 0) return "pt-BR";
      if (lower.indexOf("no") === 0 || lower.indexOf("nn") === 0) return "nb";
      var base = lower.split("-")[0];
      if (JOIN_I18N[base]) return base;
    }
    return "en";
  }

  function render(lang) {
    var t = JOIN_I18N[lang];
    document.documentElement.lang = lang;
    document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
    document.getElementById("title").textContent = t[0];
    document.getElementById("lead").textContent = t[1];
    document.getElementById("code-label").textContent = t[2];
    document.getElementById("open").textContent = t[3];
    document.getElementById("install").textContent = t[4];
    document.getElementById("steps").textContent = t[5];
    document.getElementById("copy").textContent = t[6];
    document.getElementById("copy").dataset.done = t[7];
    document.getElementById("no-code").textContent = t[8];
  }

  var select = document.getElementById("lang-select");
  Object.keys(JOIN_I18N).forEach(function (key) {
    var option = document.createElement("option");
    option.value = key;
    option.textContent = NAMES[key] || key;
    select.appendChild(option);
  });
  var lang = pick();
  select.value = lang;
  select.addEventListener("change", function () { render(select.value); });
  render(lang);

  if (code) {
    document.getElementById("code").textContent = code.slice(0, 4) + "-" + code.slice(4);
    document.getElementById("open").href = "romysgarage://join?code=" + code;
  } else {
    document.getElementById("code-box").classList.add("hidden");
    document.getElementById("open").classList.add("hidden");
    document.getElementById("no-code").classList.remove("hidden");
  }

  document.getElementById("copy").addEventListener("click", function () {
    var button = this;
    var text = code.slice(0, 4) + "-" + code.slice(4);
    function done() { button.textContent = button.dataset.done; }
    if (navigator.clipboard) { navigator.clipboard.writeText(text).then(done, done); } else { done(); }
  });
})();
</script>
