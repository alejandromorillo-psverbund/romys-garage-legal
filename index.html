<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Legal — Romy's Garage</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #ffffff; --fg: #1a1a1a; --muted: #5b5b5b; --border: #e2e2e2; --accent: #2563eb;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #14161a; --fg: #eaeaea; --muted: #a3a3a3; --border: #2c2f36; --accent: #7aa2ff; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  .wrap { max-width: 760px; margin: 0 auto; padding: 48px 20px 96px; }
  nav.top { max-width: 760px; margin: 0 auto; padding: 20px; font-size: 14px; }
  nav.top a { color: var(--muted); text-decoration: none; }
  nav.top a:hover { color: var(--accent); }
  h1 { font-size: 1.9rem; margin: 0 0 4px; }
  h2 { font-size: 1.3rem; margin-top: 2.4em; border-top: 1px solid var(--border); padding-top: 1.4em; }
  h3 { font-size: 1.05rem; margin-top: 1.8em; }
  p, li { color: var(--fg); }
  strong { color: var(--fg); }
  a { color: var(--accent); }
  blockquote {
    margin: 1.2em 0; padding: 0.2em 1em; border-left: 3px solid var(--accent);
    color: var(--muted); background: color-mix(in srgb, var(--accent) 6%, transparent);
    border-radius: 0 6px 6px 0;
  }
  table { border-collapse: collapse; width: 100%; margin: 1.2em 0; font-size: 0.92rem; }
  th, td { border: 1px solid var(--border); padding: 8px 10px; text-align: left; vertical-align: top; }
  th { background: color-mix(in srgb, var(--fg) 6%, transparent); }
  code { background: color-mix(in srgb, var(--fg) 8%, transparent); padding: 0.15em 0.4em; border-radius: 4px; font-size: 0.9em; }
  .updated { color: var(--muted); font-size: 0.95rem; margin-bottom: 2.2em; }
  hr { border: none; border-top: 1px solid var(--border); margin: 2.5em 0; }
</style>
</head>
<body>
<div class="wrap">

<h1>Romy's Garage — Legal</h1>
<p class="updated">Legal documents for the Romy's Garage iOS app.</p>
<ul>
  <li><a href="privacy-policy.html">Privacy Policy</a></li>
  <li><a href="terms-of-service.html">Terms and Conditions</a></li>
</ul>

</div>
</body>
</html>
